<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mata Mosquito</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA INICIAL -->
    <div id="tela-inicial">

        <h1>Mata Mosquito</h1>

        <p>
            Elimine o máximo de mosquitos antes que o tempo acabe!
        </p>

        <div class="controles-jogo">

            <label for="dificuldade">Dificuldade:</label>

            <select id="dificuldade">
                <option value="1500">Normal</option>
                <option value="1000">Difícil</option>
                <option value="750">Chuck Norris</option>
            </select>

            <button onclick="iniciarJogo()">
                Iniciar Jogo
            </button>

        </div>

        <!-- RANKING -->
        <div class="secao-ranking">

            <h2>🏆 Ranking</h2>

            <table>

                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Nickname</th>
                        <th>Pontos</th>
                        <th>Data</th>
                    </tr>
                </thead>

                <tbody id="tabela-ranking">
                </tbody>

            </table>

        </div>

    </div>


    <!-- TELA DO JOGO -->
    <div id="tela-jogo" class="hidden">

        <!-- HUD -->
        <div class="hud">

            <div class="vidas">

                <img
                    id="v1"
                    class="coracao"
                    src="imagens/coracao_cheio.png"
                >

                <img
                    id="v2"
                    class="coracao"
                    src="imagens/coracao_cheio.png"
                >

                <img
                    id="v3"
                    class="coracao"
                    src="imagens/coracao_cheio.png"
                >

            </div>

            <div class="cronometro">
                Tempo:
                <span id="tempo">30</span>s
            </div>

            <div class="pontuacao">
                Pontos:
                <span id="pontos-atuais">0</span>
            </div>

        </div>


        <!-- ÁREA DO JOGO -->
        <div id="palco-jogo"></div>

    </div>


    <!-- GAME OVER -->
    <div id="modal-game-over" class="modal hidden">

        <div class="modal-conteudo">

            <h2 id="titulo-fim">
                Fim de Jogo!
            </h2>

            <p>
                Sua pontuação final foi:
                <strong id="pontos-finais">0</strong>
            </p>


            <form
                id="form-ranking"
                onsubmit="salvarPontuacao(event)"
            >

                <input
                    type="text"
                    id="nickname"
                    placeholder="Digite seu nickname"
                    maxlength="50"
                    required
                >

                <button
                    type="submit"
                    id="btn-salvar"
                >
                    Salvar no Ranking
                </button>

            </form>


            <button
                onclick="reiniciarJogo()"
                class="btn-secundario"
            >
                Jogar Novamente
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
